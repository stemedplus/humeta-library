name: Library website

# Builds the HuMeta Library website and publishes it to GitHub Pages
# (https://jlib271.github.io/humeta-library/). The site includes data/library.tar.gz, the library's
# own files, which the HuMeta Portal reads; so publishing the site is how a merged change reaches the
# portal. Rebuilt daily, so new deposits in the STEMEd+ Library's Data and Studies collections appear on
# the Datasets and Studies pages, and changes to the portal's code that shape the pages show up.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # full history: the instruments feed dates each instrument by when it was added
      - uses: actions/checkout@v7
        with:
          repository: JLib271/HuMeta
          path: .humeta
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Refresh the shared STEMEd+ look
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/JLib271/stemedplus-theme.git "$RUNNER_TEMP/stemedplus-theme"
          python "$RUNNER_TEMP/stemedplus-theme/apply.py" .
      - run: pip install -r requirements.txt
      - name: Validate the library
        run: python scripts/validate_library.py --vocabularies .humeta/standard/humeta/vocabularies.json
      - name: Read the STEMEd+ Library's Data collection
        run: python scripts/fetch_datasets.py --out _datasets.json
      - name: Read the STEMEd+ Library's Studies collection
        run: python scripts/fetch_datasets.py --kind studies --out _studies.json
      - name: Build the site
        env:
          HUMETA_DIR: .humeta
        run: python scripts/build_site.py --out _site --datasets _datasets.json --studies _studies.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
